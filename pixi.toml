[workspace]
authors = ["Allen Guo <guosonglin001@gmail.com>"]
channels = ["conda-forge"]
name = "codex-xyz"
platforms = ["osx-arm64"]
version = "0.1.0"

[dependencies]
python = ">=3.14.5,<3.15"
uv = ">=0.11.19,<0.12"
ruff = ">=0.15.16,<0.16"
ty = ">=0.0.44,<0.0.45"
pre-commit = ">=4.6.0,<5"
hatchling = ">=1.30.1,<2"

zellij = ">=0.44.3,<0.45"
aria2 = ">=1.37.0,<2"

nomkl = ">=1.0,<2"

pytorch = { version = ">=2.11.0,<3", build = "*cpu_generic*" }
torchvision = ">=0.26.0,<0.27"
openai = ">=2.41.0,<3"

[activation.env]
HOME = "${PIXI_PROJECT_ROOT}/dot.home"
XDG_CONFIG_HOME = "${PIXI_PROJECT_ROOT}/dot.home/.config"
XDG_DATA_HOME = "${PIXI_PROJECT_ROOT}/dot.home/.data"
XDG_CACHE_HOME = "${PIXI_PROJECT_ROOT}/dot.home/.cache"

CODEX_XYZ_UI_URL = "http://127.0.0.1:1123"
CODEX_XYZ_API_URL = "http://127.0.0.1:3211"
