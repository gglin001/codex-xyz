<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#161718" />
		<title>coz offline</title>
		<style>
			:root {
				color-scheme: dark;
				font-family:
					Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
					"Segoe UI", sans-serif;
				background: #161718;
				color: #f5f5f7;
			}

			* {
				box-sizing: border-box;
			}

			html,
			body {
				min-height: 100%;
				margin: 0;
			}

			body {
				display: grid;
				place-items: center;
				padding: max(24px, env(safe-area-inset-top))
					max(20px, env(safe-area-inset-right))
					max(24px, env(safe-area-inset-bottom))
					max(20px, env(safe-area-inset-left));
				background: #161718;
			}

			main {
				width: min(100%, 420px);
				border: 1px solid rgba(255, 255, 255, 0.1);
				border-radius: 12px;
				background: #1c1d20;
				padding: 24px;
				box-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
			}

			img {
				display: block;
				width: 48px;
				height: 48px;
				margin-bottom: 18px;
			}

			h1 {
				margin: 0;
				font-size: 20px;
				line-height: 1.25;
			}

			p {
				margin: 10px 0 0;
				color: #b8b8be;
				font-size: 14px;
				line-height: 1.6;
			}

			button {
				margin-top: 20px;
				width: 100%;
				height: 40px;
				border: 1px solid rgba(168, 200, 255, 0.28);
				border-radius: 8px;
				background: #a8c8ff;
				color: #121316;
				font: inherit;
				font-size: 14px;
				font-weight: 650;
			}
		</style>
	</head>
	<body>
		<main>
			<img src="/icons/icon-192.png" alt="" />
			<h1>coz is offline</h1>
			<p>
				The app shell is installed, but Codex threads and terminal state need the
				local server connection.
			</p>
			<button type="button" onclick="window.location.reload()">Retry</button>
		</main>
	</body>
</html>
